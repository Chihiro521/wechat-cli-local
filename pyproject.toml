[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-cli-local"
version = "0.3.0"
description = "Command line queries and exports for local WeChat data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.scripts]
wechat-cli = "wechat_cli.main:cli"

[project.urls]
Repository = "https://github.com/Chihiro521/wechat-cli-local"
Issues = "https://github.com/Chihiro521/wechat-cli-local/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wechat_cli*"]

[tool.setuptools.package-data]
wechat_cli = ["bin/*"]
